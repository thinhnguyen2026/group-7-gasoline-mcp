services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27028:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6388:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
volumes:
  mongo_data:
  redis_data:
